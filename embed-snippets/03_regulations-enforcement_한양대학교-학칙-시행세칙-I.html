<div class="academic-work-frame">
  <iframe
    id="ericaHandbook-regulations-enforcement"
    src="https://yoorhi816.github.io/erica-academic-handbook/?embed=regulations-enforcement&amp;v=20260911-1"
    title="한양대학교 학칙 시행세칙(I) 안내"
    loading="lazy"
    width="100%"
    height="1200"
    frameborder="0"
    scrolling="no"
    style="display:block; width:100%; min-height:1200px; border:0; overflow:hidden; background:#fff;">
  </iframe>
</div>

<style>
  .academic-work-frame { width:100%; max-width:1440px; margin:0 auto; background:#fff; }
  .academic-work-frame iframe { display:block; width:100%; min-height:1200px; border:0; overflow:hidden; background:#fff; }
  @media (max-width:768px) { .academic-work-frame iframe { min-height:1600px; } }
</style>

<script>
  window.addEventListener("message", function (event) {
    if (event.origin !== "https://yoorhi816.github.io") return;
    if (!event.data) return;
    if (event.data.type !== "erica-handbook:resize") return;
    if (event.data.slug !== "regulations-enforcement") return;
    var frame = document.getElementById("ericaHandbook-regulations-enforcement");
    if (!frame) return;
    if (event.source !== frame.contentWindow) return;
    var height = Number(event.data.height);
    if (!Number.isFinite(height)) return;
    var nextHeight = Math.max(1200, Math.ceil(height));
    if (Math.abs(frame.offsetHeight - nextHeight) > 1) {
      frame.style.height = nextHeight + "px";
    }
  });
</script>
